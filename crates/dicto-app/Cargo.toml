[package]
name = "dicto-app"
version = "0.1.0"
edition = "2021"
description = "Dicto — Push-to-talk speech-to-text binary"

[dependencies]
dicto-core = { path = "../dicto-core" }
dicto-gui = { path = "../dicto-gui" }
log = "0.4"
simple-logger = "4"
native-windows-gui = { version = "1.0", features = ["frame", "listbox"] }

[[bin]]
name = "dicto"
path = "src/main.rs"