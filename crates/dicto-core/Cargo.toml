[package]
name = "dicto-core"
version = "0.1.0"
edition = "2021"
description = "Core engine: audio capture, STT, post-processing, output"

[dependencies]
# Audio capture
cpal = "0.15"

# STT engine — whisper.cpp bindings with real-time PCM streaming
whisper-cpp-plus = "0.1"

# Keyboard simulation (paste)
enigo = { version = "0.2", features = ["clipboard"] }

# Serialization for config/dictionary
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
log = "0.4"
simple_logger = "4"

# Error handling
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Ring buffer for audio capture
regex = "1"
num_cpus = "1"
winapi = { version = "0.3", features = ["winuser", "winbase", "synchapi", "ntdef"] }